# Installed over live-build's version by hooks/live/0500-boot-menu.hook.binary
set default=0
set timeout=10
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=1024x768,800x600,auto
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png
loadfont /boot/grub/chip-theme/comfortaa_22.pf2
loadfont /boot/grub/chip-theme/dejavu_16.pf2
loadfont /boot/grub/chip-theme/dejavu_bold_16.pf2
set theme=/boot/grub/chip-theme/theme.txt
export theme
set color_normal=light-gray/black
set color_highlight=white/blue

terminal_output gfxterm

# A short, friendly three-note chime (also tells blind users the menu is ready).
insmod play
play 1800 784 1 1047 1 1319 2
