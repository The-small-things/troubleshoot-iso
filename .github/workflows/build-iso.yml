name: Build ISO

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]  # e.g. `gh release create v1.2.0` – builds the ISO and attaches it
  workflow_dispatch:
    inputs:
      release_tag:
        description: "To publish a release, enter its tag (e.g. v1.2.0). Leave empty to just build."
        required: false
        default: ""

permissions:
  contents: write  # attach the ISO to the GitHub release it was built for

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # the version Debian trixie ships
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile everything
        run: python -m compileall -q src

  iso:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build ca-certificates
      - name: Build ISO
        run: ./build.sh
      - name: Check ISO size
        run: |
          size=$(stat -c %s dist/*.iso)
          echo "ISO size: $((size / 1024 / 1024)) MiB"
          if [ "$size" -ge 2147483648 ]; then
            echo "::error::The ISO is over 2 GiB, GitHub's limit for release files. Trim live/config/includes.chroot/usr/share/troubleshoot/apps.list."
            exit 1
          fi
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: troubleshoot-iso
          path: dist/*
          compression-level: 0

  boot-test:
    # Boot the new ISO in QEMU (UEFI + BIOS) and screenshot the boot menu, splash and app.
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: troubleshoot-iso
          path: dist
      - name: Install QEMU and enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Add a REPORTS partition to a USB stick image, as the app does
        run: |
          sudo apt-get install -y --no-install-recommends dosfstools fdisk
          sudo tools/stick_test.sh dist/*.iso stick.img
      - name: Boot and take screenshots
        run: python3 tools/boot_test.py dist/*.iso screenshots --print-base64 --usb-image stick.img
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-screenshots
          path: screenshots/

  release:
    # Publish only an ISO that passed the boot test: either attach it to a release someone
    # published, or (manual run with a tag) create the release here.
    needs: [iso, boot-test]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: troubleshoot-iso
          path: dist
      - name: Attach to the published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
      - name: Create the release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Hardware Troubleshooter ${{ inputs.release_tag }}
          generate_release_notes: true
          files: dist/*
