Section "ServerFlags"
    # The keyboard test asks for every key: Ctrl+Alt+F-keys and Ctrl+Alt+Backspace must not
    # switch consoles or kill the display.
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    # Never blank the screen during long tests.
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "InputClass"
    # Most people expect tapping the touchpad to click.
    Identifier "troubleshoot touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
EndSection
